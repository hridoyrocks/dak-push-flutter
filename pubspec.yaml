name: dak_push
description: Flutter SDK for Dak, a self-hosted push notification server. Registers the device's FCM token, links it to your user, keeps tags, reports notification opens, and shows in-app messages.
version: 0.2.0
publish_to: none
repository: https://github.com/hridoyrocks/dak-push

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

# Wide ranges on purpose, so the SDK fits into apps that already use these
# plugins (Amar Partner is on firebase_messaging 15).
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ">=3.0.0 <6.0.0"
  firebase_messaging: ">=15.0.0 <18.0.0"
  flutter_secure_storage: ">=9.0.0 <12.0.0"
  package_info_plus: ">=8.0.0 <11.0.0"
  device_info_plus: ">=10.0.0 <14.0.0"
  http: ">=1.0.0 <2.0.0"
  url_launcher: ">=6.1.0 <7.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

name: Feature request
description: Something dak_push should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: An API sketch helps, if you have one in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - avoid_dynamic_calls
    - prefer_final_locals
    - public_member_api_docs
    - unawaited_futures

# Read by dart format from Dart 3.7 on (CI, IDEs, pub.dev).
formatter:
  page_width: 120
